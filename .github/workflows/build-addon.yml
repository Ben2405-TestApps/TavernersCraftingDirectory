name: Build Taverners Crafting Directory
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare addon folder
        run: |
          mkdir -p dist/TavernersCraftingDirectory
          cp TavernersCraftingDirectory.toc Core.lua Scanner.lua Sync.lua UI.lua README.md dist/TavernersCraftingDirectory/
      - name: Create ZIP
        run: |
          cd dist
          zip -r ../TavernersCraftingDirectory-${GITHUB_REF_NAME}.zip TavernersCraftingDirectory
      - uses: actions/upload-artifact@v4
        with:
          name: TavernersCraftingDirectory-${{ github.sha }}
          path: TavernersCraftingDirectory-*.zip
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TavernersCraftingDirectory-*.zip
